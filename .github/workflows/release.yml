name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Never publish two releases at once, and never cancel one part-way: a cancelled
# upload can leave a deployment stranded in the Central portal.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_COLOR: '1'
  FLIX_VERSION: 0.75.1

jobs:
  publish:
    name: Publish to Maven Central and GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      # contents: write pushes the gh-pages branch (the additive Maven-repo accumulator, same
      # pattern as wstein/flix-spec). pages: write and id-token: write are what
      # actions/deploy-pages needs to perform the actual deployment. Scoped to this job only; the
      # workflow default above stays read-only.
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache Mill and Coursier downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mill
            ~/.cache/coursier
          key: mill-${{ runner.os }}-${{ hashFiles('.mill-version', 'build.mill') }}
          restore-keys: mill-${{ runner.os }}-

      # Maven Central publications are immutable, so the tag and the version the
      # build would publish must agree before anything is uploaded. Running from
      # a branch is refused outright rather than guessing a version.
      - name: Require a tag matching publishVersion
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Release must run from a tag; got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          version="$(./mill show flixMillPlugin.publishVersion | tr -d '"')"
          if [ "${GITHUB_REF_NAME#v}" != "${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match publishVersion ${version}" >&2
            exit 1
          fi
          echo "Publishing ${version} from ${GITHUB_REF_NAME}"

      - name: Download Flix ${{ env.FLIX_VERSION }}
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/flix.jar" \
            "https://github.com/flix/flix/releases/download/v${FLIX_VERSION}/flix.jar"

      # The consumer gate is the last thing standing between a mistake and a
      # permanent coordinate, so it runs again here even though CI already ran it.
      - name: Run the consumer gate
        env:
          FLIX_JAR: ${{ runner.temp }}/flix.jar
        run: ./mill flixMillPlugin.test + flixMillPlugin.integration

      # --------------------------------------------------------------------------
      # GitHub Pages Maven repository: a zero-secret, immediately-usable channel
      # alongside Sonatype Central. Central requires an approved account and PGP
      # signing (four secrets below); this needs neither, so it publishes first --
      # a missing Central secret must never prevent this from succeeding, and does
      # not, because it runs and completes before Central is ever touched.
      #
      # Modeled on wstein/flix-spec's own GitHub-Pages Maven pipeline, adapted for
      # Mill rather than Gradle: `publishM2Local` writes standard Maven layout to an
      # arbitrary directory, but -- unlike Gradle's `maven-publish` -- generates no
      # checksums and knows nothing about any other version already published.
      # `publishTools` (this repository's own unpublished CI-tooling module) supplies
      # both, plus the landing page.
      # --------------------------------------------------------------------------

      - name: Determine Publish Coordinates
        # Asked of Mill, not reconstructed: `artifactId` already carries the platform
        # suffix (`flix-mill-plugin_mill1_3`), and rebuilding that by hand is exactly
        # the mistake that broke flix-spec's own pipeline earlier this project's
        # history -- a hand-reconstructed coordinate silently drifted from what the
        # build tool actually produces.
        id: coords
        run: |
          set -euo pipefail
          GROUP_ID="$(./mill --ticker false --color false show flixMillPlugin.pomSettings | jq -r .organization)"
          ARTIFACT_ID="$(./mill --ticker false --color false show flixMillPlugin.artifactId | tr -d '"')"
          VERSION="$(./mill --ticker false --color false show flixMillPlugin.publishVersion | tr -d '"')"
          {
            echo "group_id=${GROUP_ID}"
            echo "artifact_id=${ARTIFACT_ID}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}"

      - name: Checkout gh-pages Worktree
        # The orphan-branch path is destructive: it discards the whole publish history, including
        # every prior Maven version. flix-spec's own pipeline lost a release this way when
        # `git ls-remote` failed for a reason *other* than "the branch does not exist" and the
        # fallback could not tell the difference. `ls-remote --exit-code` can: exit 2 means the ref
        # genuinely does not exist (safe to create fresh); any other non-zero exit is a real error
        # and must fail loudly rather than be silently treated as "branch is empty, start over."
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            git fetch origin gh-pages
            git worktree add gh-pages-worktree origin/gh-pages
          elif [ "$RC" -eq 2 ]; then
            echo "gh-pages does not exist yet; creating it fresh."
            git worktree add --detach gh-pages-worktree
            git -C gh-pages-worktree checkout --orphan gh-pages
            git -C gh-pages-worktree rm -rf . > /dev/null 2>&1 || true
          else
            echo "FATAL: git ls-remote for gh-pages failed with exit $RC, which is not" >&2
            echo "       'branch does not exist' (that is exit 2). Refusing to create an" >&2
            echo "       orphan branch, which would discard the entire publish history." >&2
            exit "$RC"
          fi

      - name: Refuse to Republish an Existing Version
        # Central publications are immutable and this mirror should behave the same way: once a
        # version is up, it does not move under the same coordinate.
        run: |
          set -euo pipefail
          # Only the group id's dots become path separators -- rebuilt explicitly rather than a
          # blanket replace across the whole path, which would also mangle a dotted version number
          # (e.g. 0.1.0) if DEST contained one.
          GROUP_PATH="$(echo "${{ steps.coords.outputs.group_id }}" | tr '.' '/')"
          DEST="gh-pages-worktree/maven/${GROUP_PATH}/${{ steps.coords.outputs.artifact_id }}/${{ steps.coords.outputs.version }}"
          if [ -d "$DEST" ]; then
            echo "FATAL: ${{ steps.coords.outputs.version }} is already published at $DEST." >&2
            echo "This mirror is immutable, same as Central -- bump publishVersion instead." >&2
            exit 1
          fi
          echo "Publishing new version at $DEST"

      - name: Publish M2 Layout
        run: |
          ./mill flixMillPlugin.publishM2Local --m2RepoPath "$(pwd)/gh-pages-worktree/maven"

      - name: Generate Checksums, Metadata and Landing Page
        run: |
          ./mill publishTools.run \
            "$(pwd)/gh-pages-worktree/maven" \
            "$(pwd)/gh-pages-worktree/index.html" \
            "${{ steps.coords.outputs.group_id }}" \
            "${{ steps.coords.outputs.artifact_id }}" \
            "${{ steps.coords.outputs.version }}" \
            "wstein.github.io/flix-mill-plugin"

      - name: Commit and Push gh-pages
        id: commit
        run: |
          set -euo pipefail
          cd gh-pages-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maven index.html
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "publish: ${{ steps.coords.outputs.version }}"
          git push origin HEAD:gh-pages
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages Artifact
        if: steps.commit.outputs.changed == 'true'
        # The whole accumulated tree, not just this run's additions: Actions-based Pages
        # deployment replaces the entire site on every deploy, so every prior version has to be
        # part of what is uploaded here or it vanishes from what is actually served.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: gh-pages-worktree

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify the Published Coordinate Actually Resolves
        # Deploying is not publishing. A throwaway Mill consumer project, resolving through the
        # real public URL with the real `//| mvnDeps:` syntax, is the only step here that proves a
        # Mill build can actually depend on this -- more faithful than an HTTP GET, which would
        # only prove the files exist, not that Mill's own resolution and header-comment dependency
        # syntax work against them.
        run: |
          set -euo pipefail
          GROUP_ID="${{ steps.coords.outputs.group_id }}"
          ARTIFACT_ID="${{ steps.coords.outputs.artifact_id }}"
          VERSION="${{ steps.coords.outputs.version }}"

          PROBE="$(mktemp -d)"
          cat > "$PROBE/build.mill" <<EOF
          //| mvnDeps:
          //| - ${GROUP_ID}::${ARTIFACT_ID}::${VERSION}
          //| repositories:
          //| - https://wstein.github.io/flix-mill-plugin/maven/

          import flixmill.FlixModule

          object app extends FlixModule
          EOF
          cp .mill-version "$PROBE/.mill-version"
          cp mill "$PROBE/mill"
          chmod +x "$PROBE/mill"

          for attempt in $(seq 1 20); do
            if ( cd "$PROBE" && ./mill --ticker false resolve app._ ) >/tmp/probe.log 2>&1; then
              echo "OK: ${GROUP_ID}:${ARTIFACT_ID}:${VERSION} resolves and app.FlixModule loads"
              exit 0
            fi
            echo "not resolvable yet (attempt $attempt); Pages may still be propagating"
            sleep 30
          done

          echo "FATAL: ${GROUP_ID}:${ARTIFACT_ID}:${VERSION} never became resolvable." >&2
          cat /tmp/probe.log >&2
          exit 1

      - name: Verify the Landing Page Actually Resolves
        run: |
          set -euo pipefail
          URL="https://wstein.github.io/flix-mill-plugin/"

          for attempt in $(seq 1 20); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' -L "$URL")"
            if [ "$CODE" = "200" ]; then
              echo "OK: $URL resolves"
              exit 0
            fi
            echo "not resolvable yet (attempt $attempt, HTTP $CODE); Pages may still be propagating"
            sleep 30
          done

          echo "FATAL: $URL never returned 200." >&2
          exit 1

      # Uploads a signed bundle and stops. `sonatypeCentralShouldRelease` is false,
      # so the deployment waits in the portal until a human publishes it.
      - name: Upload the signed bundle to the Central portal
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.MILL_PGP_PASSPHRASE }}
        run: ./mill flixMillPlugin.publishSonatypeCentral
