version: 2

# Dependabot has no Mill ecosystem, so `build.mill` dependencies — Mill itself, the
# Scala version, and `mill-testkit` — are updated by hand. The workflow actions below
# are the part it can keep current.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
